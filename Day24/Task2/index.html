<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
</head>
<body>
    <h1 style="display: flex; align-items: center;justify-content: center; font-size: 40px; color: rgb(59, 59, 59);">Image Carousel</h1>
    <div id ="clsImg" style="height: 400px;width: 500px;display: flex;align-items: center;overflow-x: scroll; margin-top: 200px; margin-left: 600px;background-color: aliceblue;">
    </div>
    <div style="display: flex;justify-content: space-between;">
    <button id="btn1" style="margin-left: 570px; margin-top: 40px; border: none; padding: 20px;background-color: rgb(172, 169, 169); border-radius: 6px;font-size: 20px;color: rgb(15, 15, 15);">Prev</button>
    <button id="btn2" style="margin-right: 700px; margin-top: 40px; border: none; padding: 20px;background-color: rgb(172, 169, 169); border-radius: 6px;font-size: 20px;color: rgb(15, 15, 15);">Next</button>
    </div>
</body>
<script src="script.js"></script>
</html>
