<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Window</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Modal Window</h1>
    <!-- <button id="modalBtn">Click to open Modal</button> -->
    <div class="modal" id="modal">
            <img id="closeImg" class="closeImg" src="close.png" alt="closeImg">
            <div class="modalHead" id="modalHead">
                <h2 class="mainHead">Modal Window</h2>
            </div>
            <div class="modalCont" id="modalCont">
                <p>This is a modal window</p>
                <p>Do You Want to Continue ?</p>
                <div class="btnFlex" id="btnFlex">
                    <button class="btnIn">Yes</button>
                </div>
            </div>
    </div>
</body>
<script src="script.js"></script>
</html>
